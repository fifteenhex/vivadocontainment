# Generated from config.mk at image build time.
BROKER=@BROKER@
PORT=@PORT@
TOPIC=@TOPIC@
USER=@USER@
PASS=@PASS@
WORKER=@WORKER@
# Where projects live. Put this on the scratch disk: the root filesystem is
# a tmpfs overlay and is thrown away at poweroff.
ROOT=@ROOT@
MAX_CHUNK=262144
# Where the licence is, so the worker can see whether it may run a second
# Vivado beside the first. A server address rather than a file means it
# cannot tell, and it stays with one job at a time.
LICENSE=@LICENSE@
# A light job may not take longer than this, which is what stops "light"
# from being a way to jump the queue.
LIGHT_MAX_SECONDS=300
# A heavy job waits until this much memory is free before it starts.
HEAVY_MEM_MIN_MB=4096
# Each job runs in a systemd scope capped at this much memory, as a
# percentage of RAM or a size. When a build exceeds it the kernel kills
# that job and nothing else -- the worker keeps answering, which is the
# whole point. The slice below caps the total across both lanes.
JOB_MEM_MAX=60%
JOB_SLICE=vc-jobs.slice
# Requests are handled on this many threads, in order per project.
WORKERS=4
# How often the retained status is republished, so its timestamp
# going stale is what tells a client the worker has stopped.
HEARTBEAT_SECONDS=30
# Each project runs its jobs as its own uid, allocated from UID_BASE upward
# and recorded in <ROOT>/.meta/<project>.uid, which is root-owned and outside
# every project. Turn this off only if you want every job running as root
# with the run of the whole guest.
RUN_AS_USER=yes
UID_BASE=3000
# Job records and logs kept per project; the oldest are dropped past this.
JOB_HISTORY=200
# Abandoned chunked uploads are removed after this many seconds.
INCOMING_MAX_AGE=86400
