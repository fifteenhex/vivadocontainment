[Service]
ExecStart=
# -f is what makes login trust the name agetty already authenticated. Debian's
# stock -o "-p -- \\u" has no -f because it does not autologin; keeping it as-is
# alongside --autologin replaces agetty's own options and login prompts for a
# password instead, timing out every 60 seconds.
ExecStart=-/sbin/agetty -o "-p -f -- \\u" --autologin root --keep-baud 115200,57600,38400,9600 %I $TERM
