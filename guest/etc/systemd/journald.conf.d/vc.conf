[Journal]
# There is no /var/log/journal here -- the root filesystem is a tmpfs overlay
# -- so the journal lives in /run, which is RAM. Left alone systemd would let
# it grow to a tenth of it, which on a 64G guest is 6G of build output held
# at the expense of the build.
Storage=volatile
RuntimeMaxUse=128M
RuntimeMaxFileSize=16M
